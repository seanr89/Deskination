name: Docker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/booking-api/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches:
      - main
    paths:
      - 'src/services/booking-api/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    name: Booking API Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Booking API container image
        uses: docker/build-push-action@v7
        with:
          context: ./src/services/booking-api
          file: ./src/services/booking-api/Dockerfile
          push: false
          load: false
          tags: deskination-booking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
