name: Backend Deploy (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - 'src/services/booking-api/**'
      - '.github/workflows/deploy-booking-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Test & Package Backend API
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/services/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/services/booking-api/booking-api.csproj
          dotnet restore src/services/booking-api.Tests/BookingApi.Tests.csproj

      - name: Run Backend Tests
        run: >
          dotnet test src/services/booking-api.Tests/BookingApi.Tests.csproj
          --no-restore
          -c Release
          --verbosity normal

      - name: Publish API
        run: >
          dotnet publish src/services/booking-api/booking-api.csproj
          --no-restore
          -c Release
          -o ./publish
          /p:UseAppHost=false

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v7
        with:
          name: booking-api-publish
          path: ./publish
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Azure Web App
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check Azure Web App Configuration & Publish Profile
        id: check-profile
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          missing=()
          if [ -z "${AZURE_WEBAPP_NAME}" ]; then
            missing+=("AZURE_WEBAPP_NAME")
          fi
          if [ -z "${AZURE_WEBAPP_PUBLISH_PROFILE}" ]; then
            missing+=("AZURE_WEBAPP_PUBLISH_PROFILE")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Azure deployment configuration (${missing[*]}). Deployment will be skipped."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Build Artifact
        if: steps.check-profile.outputs.can_deploy == 'true'
        uses: actions/download-artifact@v7
        with:
          name: booking-api-publish
          path: ./publish

      - name: Deploy to Azure Web App
        id: deploy-webapp
        if: steps.check-profile.outputs.can_deploy == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
