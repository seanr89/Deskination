name: Backend Deploy (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - 'src/services/booking-api/**'
      - '.github/workflows/deploy-booking-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, Test & Publish (.NET 10)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/services/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/services/booking-api/booking-api.csproj
          dotnet restore src/services/booking-api.Tests/BookingApi.Tests.csproj

      - name: Build and test Booking API
        run: >
          dotnet test src/services/booking-api.Tests/BookingApi.Tests.csproj
          --no-restore
          -c Release

      - name: Publish Release output
        run: >
          dotnet publish src/services/booking-api/booking-api.csproj
          --no-restore
          -c Release
          -o ./publish
          /p:UseAppHost=false

      - name: Upload published package artifact
        uses: actions/upload-artifact@v7
        with:
          name: booking-api-publish
          path: ./publish
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy-webapp.outputs.webapp-url }}

    steps:
      - name: Download published package artifact
        uses: actions/download-artifact@v7
        with:
          name: booking-api-publish
          path: ./publish

      - name: Check Azure OIDC and App Service configuration
        id: check-config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME || vars.AZURE_WEBAPP_NAME }}
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Azure deployment configuration (${missing[*]}). Deployment will be skipped."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure (OIDC)
        if: steps.check-config.outputs.can_deploy == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy-webapp
        if: steps.check-config.outputs.can_deploy == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME || secrets.AZURE_WEBAPP_SLOT_NAME || 'production' }}
          package: ./publish
